<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect hack
      // Store the path in sessionStorage and redirect to index.html
      sessionStorage.setItem('redirectPath', window.location.pathname);
      window.location.replace(window.location.origin + '/portfolio-website/');
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
